name: Validate Draft Reports website and research exports
on:
  push:
    branches: [main]
    paths:
      - 'draft-reports/**'
      - '.github/workflows/draft-reports-verify.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'draft-reports/**'
      - '.github/workflows/draft-reports-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: node --check draft-reports/app.js
      - name: Verify all NFL draft exports, ratings and licensing fields
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("draft-reports/data/nfl")
          total=0;graded=0
          for year in range(2000,2027):
              data=json.loads((root/f"{year}.json").read_text())
              assert data["schema_version"]==2
              assert data["year"]==year and data["league"]=="NFL"
              assert "nflverse" in data["attribution"].lower()
              players=data["picks"]
              assert 200 <= len(players)<=300
              assert [p["overall"] for p in players]==list(range(1,len(players)+1))
              assert len({p["id"] for p in players})==len(players)
              assert all(not any(k.startswith("_") for k in p) for p in players)
              assert all(not any(k.startswith("_") for k in p.get("career",{})) for p in players)
              for p in players:
                  assert p["year"]==year and p["league"]=="NFL"
                  assert p["name"] and p["team"] and p["position"]
                  assert p["career"] is not None
                  assert "pace" in p
                  assert p["career_status"]
                  if year>=2024:assert p["rating"] is None
                  assert isinstance(p["career"]["awards"]["total_all_pro"],int)
                  assert p["career"]["awards"]["total_all_pro"]>=p["career"]["awards"]["first_team_all_pro"]
                  if p["rating"]:
                      r=p["rating"]
                      assert 0<=r["quality"]<=100
                      assert 0<=r["value"]<=100
                      assert r["model_version"]=="nfl-draft-v3"
                      assert r["grade_basis"] in ("career_quality","career_pace")
                      if r["grade"]:graded+=1
              total+=len(players)
          assert total==6901,(total,graded)
          assert graded>=5500,graded
          site=pathlib.Path("draft-reports/index.html").read_text()
          assert "NFL V3" in site
          assert "player-dialog" in site and 'id="year-filter"' in site
          print(f"Validated {total} NFL draft picks across 27 drafts, {graded} grades.")
          PY

      - name: Verify all NBA drafts, grades, honors, coverage and privacy
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("draft-reports/data/nba")
          total=0;graded=0
          for year in range(2000,2027):
              data=json.loads((root/f"{year}.json").read_text())
              assert data["schema_version"]==2 and data["league"]=="NBA" and data["year"]==year
              assert data["model_version"]=="nba-draft-v2"
              assert data["attribution"]
              players=data["picks"]
              assert 56<=len(players)<=60
              assert [p["overall"] for p in players]==list(range(1,len(players)+1))
              assert len({p["id"] for p in players})==len(players)
              for p in players:
                  assert p["year"]==year and p["league"]=="NBA"
                  assert p["name"] and p["team"] and p["round"] in (1,2)
                  assert not any(k.startswith("_") for k in p)
                  assert not any(k.startswith("_") for k in p["career"])
                  assert "awards" in p["career"] and "all_nba_total" in p["career"]["awards"]
                  assert "pace" in p
                  assert p["career"]["awards"]["all_nba_total"]>=p["career"]["awards"]["all_nba_first"]
                  if year>=2024: assert p["rating"] is None
                  if p["rating"] is not None:
                      assert 0<=p["rating"]["quality"]<=100
                      assert 0<=p["rating"]["value"]<=100
                      assert p["rating"]["model_version"]=="nba-draft-v2"
                      assert p["rating"]["grade_basis"] in ("career_quality","career_pace")
                      if p["rating"]["grade"]:graded+=1
              total+=len(players)
          assert total==1602,(total,graded)
          assert graded>=1300,graded
          app=pathlib.Path("draft-reports/app.js").read_text()
          assert "renderNBAProfile" in app and "'./data/' + league.toLowerCase()" in app
          assert "All-NBA First Team" in app and "Win Shares" in app
          assert pathlib.Path("draft-reports/nba-methodology.html").exists()
          print(f"Validated {total} NBA picks across 27 drafts; {graded} grades.")
          PY
