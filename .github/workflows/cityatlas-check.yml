name: CityAtlas public site checks
on:
  push:
    branches: [main]
    paths:
      - 'cityatlas/**'
      - '.github/workflows/cityatlas-check.yml'
  pull_request:
    paths:
      - 'cityatlas/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify JavaScript syntax
        run: |
          node --check cityatlas/app.js
          node --check cityatlas/preview-data.js
      - name: Validate source-backed preview data
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm'), z=require('zlib'), assert=require('node:assert/strict');
          const context={window:{}}; vm.runInNewContext(fs.readFileSync('cityatlas/preview-data.js','utf8'),context);
          const payload=JSON.parse(z.gunzipSync(Buffer.from(context.window.CITYATLAS_PREVIEW_BASE64,'base64')));
          assert.ok(payload.cities.length>=50);
          const ids=new Set();
          for (const row of payload.cities) {
            assert.match(row[0],/^\d{7}$/);
            assert.ok(!ids.has(row[0])); ids.add(row[0]);
            assert.ok(row[5]>0 && Number.isFinite(row[5]));
          }
          console.log('Validated', payload.cities.length, 'real-city GEOIDs');
          NODE
      - name: Check public CityAtlas page contract and approved nationwide export
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('node:assert/strict');
          const html=fs.readFileSync('cityatlas/index.html','utf8');
          for(const id of ['explore','migration','economy','housing','emerging','compare','matcher','methodology',
                           'jobs-table','flow-table','income-table','rpp-table','match-results','amenity-table','model-metrics']){
            assert.match(html,new RegExp('id="'+id+'"'),'Missing CityAtlas UI element '+id);
          }
          const root='cityatlas/data/';
          if(fs.existsSync(root+'cities.json')){
            for(const file of ['cities.json','migration.json','economy.json','states.json','manifest.json'])
              assert.ok(fs.existsSync(root+file),'Partial public snapshot: missing '+file);
            const data=JSON.parse(fs.readFileSync(root+'cities.json','utf8'));
            const migration=JSON.parse(fs.readFileSync(root+'migration.json','utf8'));
            const economy=JSON.parse(fs.readFileSync(root+'economy.json','utf8'));
            const states=JSON.parse(fs.readFileSync(root+'states.json','utf8'));
            const manifest=JSON.parse(fs.readFileSync(root+'manifest.json','utf8'));
            const availableExtra=['amenities.json','models.json'];
            for(const file of availableExtra){
              if(manifest.exports.includes(file)){
                assert.ok(fs.existsSync(root+file),'Manifest lists missing '+file);
                const key=file.replace('.json','')+'_sha256';
                assert.equal(crypto.createHash('sha256').update(fs.readFileSync(root+file)).digest('hex'),
                             manifest[key],'Aggregate source digest mismatch: '+file);
              }
            }
            if(fs.existsSync(root+'amenities.json')){
              const access=JSON.parse(fs.readFileSync(root+'amenities.json','utf8'));
              assert.ok(access.places.length>=19000,'Insufficient official city geographic coverage');
              assert.ok(access.coverage.cities>=19000);
            }
            if(fs.existsSync(root+'models.json')){
              const model=JSON.parse(fs.readFileSync(root+'models.json','utf8'));
              assert.ok(model.holdout.length>=1,'Missing rolling-origin validation');
              for(const f of model.conditionally_published_forecasts){
                const test=model.holdout.find(x=>x.horizon===f.horizon);
                assert.ok(test?.better_than_both===1,'Cannot publish a forecast failing benchmark gates');
              }
            }
            assert.ok(data.cities.length>=19000,'Nationwide city coverage too low');
            assert.equal(data.fields.length,22,'Schema mismatch');
            assert.ok(migration.counties.length>=250);
            assert.ok(economy.workplace_jobs.length>=600);
            assert.ok(states.rings.length>=40);
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(root+'cities.json')).digest('hex'),
                         manifest.city_sha256,'Public source digest mismatch');
            for(const file of ['cities.json','migration.json','economy.json','states.json',
              ...availableExtra.filter(x=>fs.existsSync(root+x))]){
              const raw=fs.readFileSync(root+file,'utf8');
              for(const forbidden of ['CENSUS_API_KEY','BEA_API_KEY','AWS_SECRET_ACCESS_KEY',
                 'irs_county_flows','source_runs','private_key'])
                 assert.ok(!raw.includes(forbidden),'Private research marker in '+file);
            }
            console.log('Approved 19k-place public source snapshot verified');
          }else console.log('Featured preview mode; no full public export yet');
          NODE
      - name: Prevent raw private data in public repo
        run: |
          set -euo pipefail
          test ! -f cityatlas/cityatlas.sqlite
          test ! -d cityatlas/raw
          test ! -d cityatlas/private
          if grep -r -E --include='*.js' --include='*.html' 'CENSUS_API_KEY=|BEA_API_KEY=|AWS_SECRET_ACCESS_KEY=|ghp_[A-Za-z0-9]{30}' cityatlas; then
            echo 'Potential secret in public code' >&2
            exit 1
          fi
